<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tra cứu mức phạt giao thông</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, sans-serif; background: #f5f5f4;
    display: flex; flex-direction: column; align-items: center; min-height: 100vh;
  }
  header {
    width: 100%; max-width: 720px; padding: 16px;
  }
  .header-row { display: flex; align-items: flex-start; gap: 8px; }
  .header-text { flex: 1; text-align: center; min-width: 0; }
  header h1 { font-size: 1.1rem; margin: 0 0 4px; }
  header p { font-size: 0.8rem; color: #78716c; margin: 0; }
  #chat {
    width: 100%; max-width: 720px; flex: 1; overflow-y: auto; padding: 0 16px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .msg { padding: 10px 14px; border-radius: 10px; max-width: 85%; white-space: pre-wrap; line-height: 1.4; font-size: 0.92rem; }
  .user { align-self: flex-end; background: #0ea5e9; color: white; }
  .bot { align-self: flex-start; background: white; border: 1px solid #e7e5e4; }
  .bot.refused { border-color: #f59e0b; background: #fffbeb; }
  .meta { font-size: 0.72rem; color: #a8a29e; margin-top: 4px; }
  form {
    width: 100%; max-width: 720px; padding: 12px 16px; display: flex; gap: 8px;
    position: sticky; bottom: 0; background: #f5f5f4;
  }
  input {
    flex: 1; padding: 10px 12px; border-radius: 8px; border: 1px solid #d6d3d1; font-size: 0.95rem;
  }
  button {
    padding: 10px 16px; border-radius: 8px; border: none; background: #0ea5e9; color: white;
    font-size: 0.9rem; cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  .disclaimer { font-size: 0.7rem; color: #a8a29e; text-align: center; padding-bottom: 8px; max-width: 720px; }
  .clear-btn {
    flex-shrink: 0; background: none; border: 1px solid #d6d3d1;
    border-radius: 8px; padding: 4px 10px; font-size: 0.75rem; color: #78716c; cursor: pointer;
    white-space: nowrap;
  }
</style>
</head>
<body>
<header>
  <div class="header-row">
    <div class="header-text">
      <h1>Tra cứu mức phạt giao thông đường bộ (Luật 36/2024, NĐ 168/2024, NĐ 238/2026)</h1>
      <p>Công cụ tham khảo, không phải tư vấn pháp lý. Trả lời có trích dẫn điều/khoản.</p>
    </div>
    <button type="button" class="clear-btn" id="clearBtn">Cuộc hội thoại mới</button>
  </div>
</header>
<div id="chat"></div>
<p class="disclaimer" id="status"></p>
<form id="form">
  <input id="question" placeholder="Ví dụ: Xe máy vượt đèn đỏ phạt bao nhiêu?" autocomplete="off" />
  <button id="send" type="submit">Gửi</button>
</form>
<script>
const chatEl = document.getElementById("chat");
const formEl = document.getElementById("form");
const inputEl = document.getElementById("question");
const sendEl = document.getElementById("send");
const statusEl = document.getElementById("status");
const clearBtn = document.getElementById("clearBtn");

// Giữ lịch sử qua lần tải lại trang (F5) -- chỉ lưu trên trình duyệt của
// người dùng, không gửi lên server/Claude. Có thể trống/lỗi (chế độ ẩn danh,
// site data bị chặn) nên luôn bọc try/catch và demo vẫn chạy đúng nếu không
// lưu được, chỉ là mất lịch sử sau khi tải lại.
const STORAGE_KEY = "rag-traffic-chat-demo-v1";
let history = [];

function loadSaved() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch {
    return null;
  }
}

function persist(log) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ history, log }));
  } catch {
    /* bỏ qua: chỉ ảnh hưởng tới việc giữ lịch sử, không ảnh hưởng chat hiện tại */
  }
}

function addMsg(role, text, meta, log) {
  const div = document.createElement("div");
  div.className = "msg " + (role === "user" ? "user" : "bot" + (meta && meta.refused ? " refused" : ""));
  div.textContent = text;
  if (meta) {
    const m = document.createElement("div");
    m.className = "meta";
    m.textContent = meta.line;
    div.appendChild(m);
  }
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  if (log) {
    log.push({ role, text, meta: meta || null });
    persist(log);
  }
}

const savedLog = [];
const saved = loadSaved();
if (saved && Array.isArray(saved.history) && Array.isArray(saved.log)) {
  history = saved.history;
  for (const m of saved.log) {
    addMsg(m.role, m.text, m.meta, null);
    savedLog.push(m);
  }
}

clearBtn.addEventListener("click", () => {
  history = [];
  savedLog.length = 0;
  chatEl.innerHTML = "";
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch {
    /* bỏ qua */
  }
  inputEl.focus();
});

formEl.addEventListener("submit", async (e) => {
  e.preventDefault();
  const question = inputEl.value.trim();
  if (!question) return;
  addMsg("user", question, null, savedLog);
  inputEl.value = "";
  sendEl.disabled = true;
  statusEl.textContent = "Đang tra cứu...";
  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, history }),
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    let metaLine = `${data.retrieval_ms.toFixed(0)}ms truy xuất + ${data.generation_ms.toFixed(0)}ms sinh`;
    const cites = data.citation_labels.length ? data.citation_labels : data.citations;
    if (cites.length && !data.refused) metaLine += ` · căn cứ: ${cites.join("; ")}`;
    if (data.needs_clarification) metaLine += " · cần hỏi lại";
    if (data.refused) metaLine += " · từ chối trả lời";
    addMsg(
      "assistant",
      data.answer || data.clarify_question || "(không có câu trả lời)",
      { refused: data.refused, line: metaLine },
      savedLog
    );
    history.push({ role: "user", content: question });
    history.push({ role: "assistant", content: data.answer || data.clarify_question || "" });
    persist(savedLog);
    statusEl.textContent = "";
  } catch (err) {
    statusEl.textContent = "Lỗi: " + err.message;
  } finally {
    sendEl.disabled = false;
    inputEl.focus();
  }
});
</script>
</body>
</html>
